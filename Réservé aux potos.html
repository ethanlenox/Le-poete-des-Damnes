<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<title>Terminal sécurisé</title>

</head>

<body class="terminal-page">

<div class="terminal" id="terminal"></div>

<script>

/* =========================
   ANTI PARTAGE DU LIEN
========================= */

const access = sessionStorage.getItem("potos-access");

if(access !== "ok"){

  window.location.href = "index.html";

}

/* =========================
   TERMINAL HACKER
========================= */

const terminal = document.getElementById("terminal");

const lines = [

"> Connexion au Serveur...",
"> Vérification Utilisateur...",
"> Poto Identifié...",
"> Décryptage des Archives...",
"> Ouverture des Dossiers Cachés...",
"> Accès Aautorisé...",
"> Dossiers Secrets LPDD...",
"> Chargement des Donnèes..."

];

let index = 0;

function addLine(){

  if(index < lines.length){

    const div = document.createElement("div");

    div.classList.add("line");

    div.textContent = lines[index];

    terminal.appendChild(div);

    index++;

    setTimeout(addLine, 900);

  } else {

    showTracks();

  }

}

addLine();

/* =========================
   TRACKS
========================= */

function showTracks(){

  const tracks = [

    {
      title: "Le King de la Night",
      cover: "img/cover1.jpg",
      file: "audio/Le King de la Night.mp3",
      id: "track1"
    },

    {
      title: "Lucide Inconscient",
      cover: "img/cover2.jpg",
      file: "audio/lucide inconscient.mp3",
      id: "track2"
    },

    {
      title: "Encore Nous",
      cover: "img/cover3.jpg",
      file: "audio/encore nous.mp3",
      id: "track3"
    },

    {
      title: "Capitaine Binaire",
      cover: "img/cover4.jpg",
      file: "audio/capitaine binaire.mp3",
      id: "track4"
    },

    {
      title: "Je Scroll",
      cover: "img/cover5.jpg",
      file: "audio/je scroll.mp3",
      id: "track5"
    },

    {
      title: "Plus Fort",
      cover: "img/cover6.jpg",
      file: "audio/plus fort.mp3",
      id: "track6"
    },

    {
      title: "Wait",
      cover: "img/cover7.jpg",
      file: "audio/wait.mp3",
      id: "track7"
    },

    {
      title: "Ce Soir",
      cover: "img/cover8.jpg",
      file: "audio/Ce soir.mp3",
      id: "track8"
    },

    {
      title: "Connexion",
      cover: "img/cover9.jpg",
      file: "audio/connection.mp3",
      id: "track9"
    },

    {
      title: "Soirée Folle",
      cover: "img/cover10.jpg",
      file: "audio/soirée folles.mp3",
      id: "track10"
    },

    {
      title: "Beyond the Dark",
      cover: "img/cover11.jpg",
      file: "audio/beyond the dark.mp3",
      id: "track11"
    },

    {
      title: "Magnètique",
      cover: "img/cover12.jpg",
      file: "audio/magnétique.mp3",
      id: "track12"
    }

  ];

  tracks.forEach(track => {

    const block = document.createElement("div");

    block.classList.add("download-block");

    /* NOM */

    const title = document.createElement("div");

    title.classList.add("line");

    title.textContent = "> " + track.title;

    /* COVER */

    const image = document.createElement("img");

    image.src = track.cover;

    image.style.width = "220px";

    image.style.marginTop = "20px";

    image.style.border = "1px solid #00ff88";

    /* BOUTON */

    const button = document.createElement("a");

    button.href = track.file;

    button.download = "";

    button.textContent = "TÉLÉCHARGER";

    button.classList.add("download-btn");

    /* 1 SEUL TÉLÉCHARGEMENT */

    if(localStorage.getItem(track.id)){

      button.textContent = "DÉJÀ TÉLÉCHARGÉ";

      button.classList.add("used");

    }

    button.addEventListener("click", () => {

      localStorage.setItem(track.id, "done");

      button.textContent = "DÉJÀ TÉLÉCHARGÉ";

      button.classList.add("used");

    });

    block.appendChild(title);

    block.appendChild(image);

    block.appendChild(button);

    terminal.appendChild(block);

  });

}

</script>

</body>
</html>
