<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Poète des Damnés</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- AUDIO GLOBAL (intro uniquement) -->
<audio id="introSound" src="audio/intro.mp3" preload="auto" loop></audio>

<!-- INTRO CINÉMATIQUE -->
<div id="intro">
  <h1 class="intro-title">Le Poète des Damnés</h1>
</div>

<!-- HERO -->
<section class="hero">

  <div class="hero-bg"></div>

  <div class="hero-content">

    <h1 class="main-title">Le Poète des Damnés</h1>
    <p class="subtitle">Je cherche à comprendre ce que le monde raconte.</p>

    <div class="hero-buttons">
      <a href="albums.html">Discographie</a>
      <a href="bio.html">Artiste</a>
    </div>

    <div class="video-box">
      <iframe
        src="https://www.youtube.com/embed/YNPhIaR2n_Q"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</section>

<script>
const intro = document.getElementById("intro");
const audio = document.getElementById("introSound");

/* AUDIO START */
audio.volume = 0.5;
audio.play().catch(() => {});

/* INTRO FADE OUT */
setTimeout(() => {
  intro.style.opacity = "0";
  intro.style.transform = "scale(1.15)";
}, 2000);

/* REMOVE INTRO */
setTimeout(() => {
  intro.style.display = "none";
}, 3200);

/* STOP AUDIO PROPREMENT SI ON CHANGE DE PAGE */
window.addEventListener("beforeunload", () => {
  audio.pause();
  audio.currentTime = 0;
});
</script>

</body>
</html>
