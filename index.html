<!DOCTYPE html>
<html lang="fr">
  
<head>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="img/favicon.png"> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:type" content="website">
<meta property="og:description"
content="Univers électro/cyber du Poète des Damnés">
  
<meta property="og:image" content="img/banner.jpg"> 
<meta property="og:locale" content="fr_FR"> 
  
<title>Le Poète des Damnés</title>
</head>

<body>

<!-- INTRO -->
<div id="intro">

  <div class="intro-overlay"></div>

  <div class="intro-particles"></div>

  <h1 class="intro-title">Le poète des Damnés</h1>

</div>

<!-- HERO -->
<section class="hero">

  <div class="hero-bg"></div>

  <div class="hero-content">

    <!-- BANNIÈRE -->
  <h1 class="main-title glow">Le Poète des Damnés</h1>

  <div class="title-banner">
  <img src="img/banner.jpg" class="banner">
  </div>

    <p class="highlight">
      Je cherche à comprendre ce que le monde raconte.
    </p>

    <div class="hero-buttons">
      <a href="albums.html">ALBUMS</a>
      <a href="bio.html">L.P.D.D</a>
    </div>

    <div class="video-box">
      <iframe
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        src="https://www.youtube.com/embed/jVjL0RK7zNE"
        title="Data Center"
        frameborder="0"
        allowfullscreen>
     </iframe>
    </div>

  </div>

</section>

<script>
const intro = document.getElementById("intro");
/* INTRO DISPARITION PROPRE */
window.addEventListener("load", () => {
  setTimeout(() => {
    if (intro) {
      intro.style.opacity = "0";
      setTimeout(() => intro.remove(), 800);
    }
  }, 1500);
});
</script>
<script>

document.querySelectorAll("a").forEach(link => {

  link.addEventListener("click", e => {

    const href = link.getAttribute("href");

    if (href && !href.startsWith("#")) {

      e.preventDefault();

      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location = href;
      }, 400);
    }

  });

});

</script>

<script src="intro.js"></script>

<!-- =========================
     POPUP ACCÈS SECRET
========================= -->

<div id="secret-popup" class="secret-popup">

  <div class="secret-box">

    <h2>ACCÈS RÉSERVÉ</h2>

    <input
      type="password"
      id="secret-password"
      placeholder="Code d'accès">

    <button id="secret-btn">
      CONNEXION
    </button>

    <p id="secret-error"></p>

  </div>

</div>

  <script>

/* =========================
   SYSTÈME SECRET
========================= */

const banner = document.querySelector(".banner");

const popup = document.getElementById("secret-popup");

const btn = document.getElementById("secret-btn");

const input = document.getElementById("secret-password");

const error = document.getElementById("secret-error");

/* OUVERTURE */

banner.addEventListener("click", () => {

  popup.style.display = "flex";

});

/* VALIDATION */

btn.addEventListener("click", () => {

  const password = input.value;

  if(password === "cacledossiersecretdelpdd"){

    /* CLÉ TEMPORAIRE */

    sessionStorage.setItem("potos-access", "ok");

    window.location.href = "Réservé aux potos.html";

  } else {

    error.textContent = "ACCÈS REFUSÉ";

  }

});

/* TOUCHE ENTRÉE */

input.addEventListener("keypress", (e) => {

  if(e.key === "Enter"){

    btn.click();

  }

});

/* FERMETURE */

popup.addEventListener("click", (e) => {

  if(e.target === popup){

    popup.style.display = "none";

  }

});

</script>
  
</body>
</html>
