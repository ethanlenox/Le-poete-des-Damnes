<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Poète des Damnés</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="introSound" src="audio/intro.mp3" preload="auto" loop></audio>

<!-- INTRO -->
<div id="intro">
  <h1 class="intro-title">Le Poète des Damnés</h1>
</div>

<!-- HERO -->
<section class="hero">

  <div class="hero-bg"></div>

  <div class="hero-content">

    <!-- BANNIÈRE -->
    <div class="title-banner">
      <img src="img/banner.jpg" class="banner">
      <h1 class="main-title glow">Le Poète des Damnés</h1>
    </div>

    <p class="highlight">
      Je cherche à comprendre ce que le monde raconte.
    </p>

    <div class="hero-buttons">
      <a href="albums.html">Discographie</a>
      <a href="bio.html">Artiste</a>
    </div>

    <div class="video-box">
      <iframe
        src="https://www.youtube.com/embed/jVjL0RK7zNE?si=z6l4Z2YJazuy1YVE"
        title="Data Center"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</section>

<script>
const intro = document.getElementById("intro");
const audio = document.getElementById("introSound");

/* AUDIO START CLICK */
function startAudio() {
  audio.volume = 0.6;
  audio.play().catch(() => {});
  window.removeEventListener("click", startAudio);
}
window.addEventListener("click", startAudio);

/* INTRO DISPARITION PROPRE */
window.addEventListener("load", () => {
  setTimeout(() => {
    if (intro) {
      intro.style.opacity = "0";
      setTimeout(() => intro.remove(), 800);
    }
  }, 1500);
});
</script>

</body>
</html>
