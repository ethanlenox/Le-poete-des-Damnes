<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Poète des Damnés</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO CINÉMATIQUE -->
<div id="intro">
  <h1 class="intro-title">Le Poète des Damnés</h1>
</div>

<audio id="introSound" src="audio/intro.mp3" preload="auto"></audio>

<section class="hero">

  <div class="hero-bg"></div>

  <div class="hero-content">

    <h1 class="title">Le Poète des Damnés</h1>
    <p>Je cherche à comprendre ce que le monde raconte.</p>

    <div class="hero-buttons">
      <a href="albums.html">Discographie</a>
      <a href="bio.html">Artiste</a>
    </div>

    <div class="video-box">
      <iframe
        src="https://www.youtube.com/embed/YNPhIaR2n_Q"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</section>

<script>
const intro = document.getElementById("intro");
const sound = document.getElementById("introSound");

// lancer musique
sound.volume = 0.6;
sound.play().catch(() => {});

// fade + zoom intro
setTimeout(() => {
  intro.style.opacity = "0";
  intro.style.transform = "scale(1.2)";
}, 2500);

// disparition complète
setTimeout(() => {
  intro.style.display = "none";
}, 3500);
</script>

</body>
</html>
