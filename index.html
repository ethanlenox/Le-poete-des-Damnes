<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Poète des Damnés</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="introSound" src="Le-poete-des-Damnes/audio
/intro.mp3" preload="auto" loop></audio>

<div id="intro">
  <h1 class="intro-title">Le Poète des Damnés</h1>
</div>

<section class="hero">

  <div class="hero-bg"></div>

  <div class="hero-content">

    <h1 class="main-title glow">Le Poète des Damnés</h1>

    <p class="highlight">
      Je cherche à comprendre ce que le monde raconte.
    </p>

    <div class="hero-buttons">
      <a href="albums.html">Discographie</a>
      <a href="bio.html">Artiste</a>
    </div>

    <div class="video-box">
      <iframe
        src="https://www.youtube.com/embed/YNPhIaR2n_Q"
        title="Présentation"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</section>

<script>
const audio = document.getElementById("introSound");
const text = document.querySelector(".highlight");

let audioCtx;
let analyser;
let source;

function initAudio() {
  if (audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();

  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  analyser.fftSize = 64;

  const dataArray = new Uint8Array(analyser.frequencyBinCount);

  function animate() {
    requestAnimationFrame(animate);

    analyser.getByteFrequencyData(dataArray);

    let sum = dataArray.reduce((a,b)=>a+b,0);
    let intensity = sum / dataArray.length / 255;

    let scale = 1 + intensity * 0.05;
    let glow = intensity * 35;

    text.style.transform = `scale(${scale})`;

    text.style.textShadow = `
      0 0 ${6 + glow}px rgba(255,0,0,0.35),
      0 0 ${18 + glow}px rgba(255,0,0,0.25),
      0 0 ${30 + glow}px rgba(255,0,0,0.15)
    `;
  }

  animate();
}

function startAudio() {
  audio.volume = 0.6;
  audio.play().catch(() => {});
  audioCtx.resume();
  initAudio();
  window.removeEventListener("click", startAudio);
}

window.addEventListener("click", startAudio);

window.addEventListener("beforeunload", () => {
  audio.pause();
  audio.currentTime = 0;
});
</script>

</body>
</html>
