<!DOCTYPE html>
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Poète des Damnés</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="introSound" src="audio/intro.mp3" preload="auto" loop></audio>

<div id="intro">
  <h1 class="intro-title">Le Poète des Damnés</h1>
</div>

<section class="hero">

  <div class="hero-bg"></div>

  <div class="hero-content">

    <h1 class="main-title glow">Le Poète des Damnés</h1>

    <!-- MODIF ICI -->
    <p class="glow-phrase">
      Je cherche à comprendre ce que le monde raconte.
    </p>

    <div class="hero-buttons">
      <a href="albums.html">Discographie</a>
      <a href="bio.html">Artiste</a>
    </div>

    <div class="video-box">
      <iframe
        src="https://www.youtube.com/embed/YNPhIaR2n_Q"
        title="Présentation"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</section>

<script>
const intro = document.getElementById("intro");
const audio = document.getElementById("introSound");

function startAudio() {
  audio.volume = 0.6;
  audio.play().catch(() => {});
  window.removeEventListener("click", startAudio);
}
window.addEventListener("click", startAudio);

setTimeout(() => {
  intro.style.opacity = "0";
}, 2000);

setTimeout(() => {
  intro.style.display = "none";
}, 3200);

window.addEventListener("beforeunload", () => {
  audio.pause();
  audio.currentTime = 0;
});
</script>

</body>
</html>
