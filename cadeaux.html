<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TITRES - CADEAUX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="bio-header">
  <h1>CADEAUX</h1>
  <p class="slogan">TRACKS OFFERTS</p>
</header>

<!-- COVER PRINCIPAL -->
<div style="text-align:center; margin-top:20px;">
  <img id="cover" src="img/bonus-cover.jpg"
       alt="Cover cadeaux"
       style="width:320px; border-radius:15px;"
       loading="lazy">
</div>

<!-- TRACKLIST -->
<section>

<!-- TRACK 1 -->
<div class="track"
     data-src="audio/LPDD.mp3"
     data-title="L.P.D.D"
     data-index="0"
     data-cover="img/logo.jpg">

  <div class="track-center">

    <div class="cover-wrapper">
      <img src="img/logo.jpg" loading="lazy">
    </div>

    <span>Bonus 01</span>

    <div class="music-links">
      <a href="audio/LPDD.mp3"
         download
         class="music-btn bandcamp">
         TÉLÉCHARGER
      </a>
    </div>

  </div>
</div>

<!-- TRACK 2 -->
<div class="track"
     data-src="audio/bonus2.mp3"
     data-title="Bonus 02"
     data-index="1"
     data-cover="img/logo.jpg">

  <div class="track-center">

    <div class="cover-wrapper">
      <img src="img/logo.jpg" loading="lazy">
    </div>

    <span>Bonus 02</span>

    <div class="music-links">
      <a href="audio/bonus2.mp3"
         download
         class="music-btn bandcamp">
         TÉLÉCHARGER
      </a>
    </div>

  </div>
</div>

<!-- TRACK 3 -->
<div class="track"
     data-src="audio/bonus3.mp3"
     data-title="Bonus 03"
     data-index="2"
     data-cover="img/logo.jpg">

  <div class="track-center">

    <div class="cover-wrapper">
      <img src="img/logo.jpg" loading="lazy">
    </div>

    <span>Bonus 03</span>

    <div class="music-links">
      <a href="audio/bonus3.mp3"
         download
         class="music-btn bandcamp">
         TÉLÉCHARGER
      </a>
    </div>

  </div>
</div>

</section>

<!-- MINI PLAYER -->
<div id="miniPlayer">

  <button id="prevBtn" class="play-btn">⏮</button>
  <button id="playPauseBtn" class="play-btn">▶</button>
  <button id="nextBtn" class="play-btn">⏭</button>
  <button id="repeatBtn" class="play-btn">🔁</button>
  <button id="togglePlayer" class="play-btn">☰</button>

  <span id="currentTime">0:00</span> / <span id="duration">0:00</span>

  <button id="muteBtn">🔊</button>
  <input type="range" id="volumeBar" min="0" max="1" step="0.01">

  <input type="range" id="progressBar" value="0" min="0" max="100">

  <audio id="audioPlayer" preload="metadata"></audio>

  <div id="waveform">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

</div>

<script src="player.js"></script>

</body>
</html>
