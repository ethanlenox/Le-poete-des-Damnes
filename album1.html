<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ALBUM - DATA CENTER</title>
<meta
  name="description"
  content="Découvrez DATA CENTER, un album électro/dance/house du Poète des Damnés, entre vie numérique, émotions et univers nocturne.">

<meta
  property="og:title"
  content="DATA CENTER">

<meta
  property="og:image"
  content="img/album1.jpg"> 
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
</head>

<body>

<header class="bio-header">
  <h1>ALBUM</h1>
  <p class="slogan">DATA CENTER</p>
</header>

<!-- COVER ALBUM -->
<div style="text-align:center; margin-top:20px;">
  <img src="img/album1.jpg" style="width:280px; border-radius:14px;">
</div>

<!-- TRACKLIST -->
<section>

  <div class="track" data-src="audio/cover1.mp3" data-title="Le King de la Night">
    <img src="img/cover1.jpg"loading="lazy">
    <span>01 - Le King de la Night</span>
  </div>

  <div class="track" data-src="audio/cover2.mp3" data-title="Lucide Inconscient">
    <img src="img/cover2.jpg"loading="lazy">
    <span>02 - Lucide Inconscient</span>
  </div>

  <div class="track" data-src="audio/cover3.mp3" data-title="Encore Nous">
    <img src="img/cover3.jpg"loading="lazy">
    <span>03 - Encore Nous</span>
  </div>

  <div class="track" data-src="audio/cover4.mp3" data-title="Capitaine Binnaire">
    <img src="img/cover4.jpg"loading="lazy">
    <span>04 - Capitaine Binnaire</span>
  </div>

  <div class="track" data-src="audio/cover5.mp3" data-title="Je Scroll">
    <img src="img/cover5.jpg"loading="lazy">
    <span>05 - Je Scroll</span>
  </div>

  <div class="track" data-src="audio/cover6.mp3" data-title="Plus Fort">
    <img src="img/cover6.jpg"loading="lazy">
    <span>06 - Plus Fort</span>
  </div>

  <div class="track" data-src="audio/cover7.mp3" data-title="Wait">
    <img src="img/cover7.jpg"loading="lazy">
    <span>07 - Wait</span>
  </div>

  <div class="track" data-src="audio/cover8.mp3" data-title="Ce Soir">
    <img src="img/cover8.jpg">
    <span>08 - Ce Soir</span>
  </div>

  <div class="track" data-src="audio/cover9.mp3" data-title="Connexion">
    <img src="img/cover9.jpg"loading="lazy">
    <span>09 - Connexion</span>
  </div>

  <div class="track" data-src="audio/cover10.mp3" data-title="Soirée folle">
    <img src="img/cover10.jpg"loading="lazy">
    <span>10 - Soirée folle</span>
  </div>

  <div class="track" data-src="audio/cover11.mp3" data-title="Beyond the Dark">
    <img src="img/cover11.jpg"loading="lazy">
    <span>11 - Beyond the Dark</span>
  </div>

  <div class="track" data-src="audio/cover12.mp3" data-title="Magnétique">
    <img src="img/cover12.jpg"loading="lazy">
    <span>12 - Magnétique</span>
  </div>

</section>

<!-- MINI PLAYER -->
<div id="miniPlayer">

 <button id="prevBtn" class="play-btn">⏮</button>
 <button id="playPauseBtn" class="play-btn">▶</button>
 <button id="nextBtn" class="play-btn">⏭</button>
 <button id="repeatBtn" class="play-btn">🔁</button>
 <button id="togglePlayer" class="play-btn">☰</button>
  
  <span id="trackTitle">Aucune piste</span>

  <!-- TEMPS -->
  <span id="currentTime">0:00</span> / <span id="duration">0:00</span>

  <button id="muteBtn">🔊</button>

  <input type="range" id="volumeBar" min="0" max="1" step="0.01">

  <input type="range" id="progressBar" value="0" min="0" max="100">

  <audio
  id="audioPlayer"
  preload="metadata">
</audio>

  <!-- WAVEFORM -->
  <div id="waveform">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

    <script src="player.js"></script>

 </body>
</html>
