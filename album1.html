<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DATA CENTER - Album 1</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
</head>

<body>

<header class="bio-header">
  <h1>DATA CENTER</h1>
  <p class="slogan">Album 1</p>
</header>

<!-- COVER ALBUM -->
<div style="text-align:center; margin-top:20px;">
  <img src="img/album1.jpg" style="width:280px; border-radius:14px;">
</div>

<!-- TRACKLIST -->
<section>

  <div class="track" data-src="audio/cover1.mp3" data-title="Le King de la Night">
    <img src="img/cover1.jpg">
    <span>01 - Le King de la Night</span>
  </div>

  <div class="track" data-src="audio/cover2.mp3" data-title="Lucide Inconscient">
    <img src="img/cover2.jpg">
    <span>02 - Lucide Inconscient</span>
  </div>

  <div class="track" data-src="audio/cover3.mp3" data-title="Encore Nous">
    <img src="img/cover3.jpg">
    <span>03 - Encore Nous</span>
  </div>

  <div class="track" data-src="audio/cover4.mp3" data-title="Capitaine Binnaire">
    <img src="img/cover4.jpg">
    <span>04 - Capitaine Binnaire</span>
  </div>

  <div class="track" data-src="audio/cover5.mp3" data-title="Je Scroll">
    <img src="img/cover5.jpg">
    <span>05 - Je Scroll</span>
  </div>

  <div class="track" data-src="audio/cover6.mp3" data-title="Plus Fort">
    <img src="img/cover6.jpg">
    <span>06 - Plus Fort</span>
  </div>

  <div class="track" data-src="audio/cover7.mp3" data-title="Wait">
    <img src="img/cover7.jpg">
    <span>07 - Wait</span>
  </div>

  <div class="track" data-src="audio/cover8.mp3" data-title="Ce Soir">
    <img src="img/cover8.jpg">
    <span>08 - Ce Soir</span>
  </div>

  <div class="track" data-src="audio/cover9.mp3" data-title="Connexion">
    <img src="img/cover9.jpg">
    <span>09 - Connexion</span>
  </div>

  <div class="track" data-src="audio/cover10.mp3" data-title="Soirée folle">
    <img src="img/cover10.jpg">
    <span>10 - Soirée folle</span>
  </div>

  <div class="track" data-src="audio/cover11.mp3" data-title="Beyond the Dark">
    <img src="img/cover11.jpg">
    <span>11 - Beyond the Dark</span>
  </div>

  <div class="track" data-src="audio/cover12.mp3" data-title="Magnétique">
    <img src="img/cover12.jpg">
    <span>12 - Magnétique</span>
  </div>

</section>

<!-- MINI PLAYER -->
<div id="miniPlayer">

  <button id="playPauseBtn" class="play-btn">▶</button>

  <span id="trackTitle">Aucune piste</span>

  <!-- TEMPS -->
  <span id="currentTime">0:00</span> / <span id="duration">0:00</span>

  <button id="muteBtn">🔊</button>

  <input type="range" id="volumeBar" min="0" max="1" step="0.01">

  <input type="range" id="progressBar" value="0" min="0" max="100">

  <audio id="audioPlayer"></audio>

  <!-- WAVEFORM -->
  <div id="waveform">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>
<!-- JS PLAYER -->
<script>
const audio = document.getElementById("audioPlayer");
const playBtn = document.getElementById("playPauseBtn");
const muteBtn = document.getElementById("muteBtn");
const title = document.getElementById("trackTitle");
const progress = document.getElementById("progressBar");
const volumeBar = document.getElementById("volumeBar");
const waveform = document.getElementById("waveform");

/* 🆕 TEMPS */
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

const tracks = document.querySelectorAll(".track");
const player = document.getElementById("miniPlayer");

let currentIndex = 0;
let lastScroll = 0;

/* ===================== */
/* ⏱ FORMAT TEMPS */
/* ===================== */

function formatTime(sec) {
  if (isNaN(sec)) return "0:00";

  let minutes = Math.floor(sec / 60);
  let seconds = Math.floor(sec % 60);

  if (seconds < 10) seconds = "0" + seconds;

  return minutes + ":" + seconds;
}

/* ===================== */
/* 🔊 VOLUME MÉMOIRE */
/* ===================== */

let savedVolume = localStorage.getItem("volume");
audio.volume = savedVolume !== null ? savedVolume : 1;
volumeBar.value = audio.volume;

/* ===================== */
/* 🎵 ACTIVE TRACK */
/* ===================== */

function setActiveTrack(i) {
  tracks.forEach(t => t.classList.remove("active", "playing"));
  if (tracks[i]) tracks[i].classList.add("active", "playing");
}

/* ===================== */
/* ▶ PLAY TRACK */
/* ===================== */

function playTrack(i) {
  const t = tracks[i];
  if (!t) return;

  audio.src = t.dataset.src;
  title.textContent = t.dataset.title || "Lecture...";

  audio.play();
  playBtn.textContent = "⏸";

  currentIndex = i;
  setActiveTrack(i);
}

/* CLICK TRACK */
tracks.forEach((t, i) => {
  t.addEventListener("click", () => playTrack(i));
});

/* PLAY / PAUSE */
playBtn.addEventListener("click", () => {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸";
    setActiveTrack(currentIndex);
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
});

/* ===================== */
/* 🎚 PROGRESS + TEMPS */
/* ===================== */

audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;

  progress.value = (audio.currentTime / audio.duration) * 100;

  /* 🆕 update temps */
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

/* 🆕 durée totale */
audio.addEventListener("loadedmetadata", () => {
  durationEl.textContent = formatTime(audio.duration);
});

/* SEEK */
progress.addEventListener("input", () => {
  audio.currentTime = (progress.value / 100) * audio.duration;
});

/* ===================== */
/* 🎧 FADE NEXT TRACK */
/* ===================== */

function fadeOutAndNext(nextIndex) {
  let fade = setInterval(() => {
    if (audio.volume > 0.05) {
      audio.volume -= 0.05;
    } else {
      clearInterval(fade);
      audio.pause();
      audio.volume = volumeBar.value;
      playTrack(nextIndex);
    }
  }, 50);
}

audio.addEventListener("ended", () => {
  if (currentIndex + 1 < tracks.length) {
    fadeOutAndNext(currentIndex + 1);
  } else {
    playBtn.textContent = "▶";
  }
});

/* ===================== */
/* 🔊 VOLUME */
/* ===================== */

volumeBar.addEventListener("input", () => {
  audio.volume = volumeBar.value;
  localStorage.setItem("volume", audio.volume);
});

/* MUTE */
muteBtn.addEventListener("click", () => {
  if (audio.volume > 0) {
    audio.volume = 0;
    volumeBar.value = 0;
    muteBtn.textContent = "🔇";
  } else {
    audio.volume = 1;
    volumeBar.value = 1;
    muteBtn.textContent = "🔊";
  }
});

/* ===================== */
/* 🎵 WAVEFORM */
/* ===================== */

audio.addEventListener("play", () => {
  waveform.classList.remove("paused");
});

audio.addEventListener("pause", () => {
  waveform.classList.add("paused");
});
</script>

</body>
</html>
