<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DATA CENTER - Album 1</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="bio-header">
  <h1>DATA CENTER</h1>
  <p class="slogan">Album 1</p>
</header>

<!-- COVER -->
<div class="album-cover-main">
  <img src="img/album1.jpg">
</div>

<!-- AUDIO -->
<audio id="player"></audio>

<!-- MINI PLAYER -->
<div id="miniPlayer">

  <div id="miniInfo">
    <span id="miniTitle">Aucune musique</span>
  </div>

  <div class="controls">

    <button id="prevBtn">⏮</button>
    <button id="playBtn">▶</button>
    <button id="nextBtn">⏭</button>

    <input type="range" id="progress" value="0">

    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">

  </div>
</div>

<!-- TRACKLIST -->

<div class="track" data-src="audio/album1/track1.mp3" data-title="Le King de la Night">
  <img src="img/cover1.jpg"><span>01 - Le King de la Night</span>
</div>

<div class="track" data-src="audio/album1/track2.mp3" data-title="Lucide Inconscient">
  <img src="img/cover2.jpg"><span>02 - Lucide Inconscient</span>
</div>

<div class="track" data-src="audio/album1/track3.mp3" data-title="Encore Nous">
  <img src="img/cover3.jpg"><span>03 - Encore Nous</span>
</div>

<div class="track" data-src="audio/album1/track4.mp3" data-title="Capitaine Binnaire">
  <img src="img/cover4.jpg"><span>04 - Capitaine Binnaire</span>
</div>

<div class="track" data-src="audio/album1/track5.mp3" data-title="Je Scroll">
  <img src="img/cover5.jpg"><span>05 - Je Scroll</span>
</div>

<div class="track" data-src="audio/album1/track6.mp3" data-title="Plus Fort">
  <img src="img/cover6.jpg"><span>06 - Plus Fort</span>
</div>

<div class="track" data-src="audio/album1/track7.mp3" data-title="Wait">
  <img src="img/cover7.jpg"><span>07 - Wait</span>
</div>

<div class="track" data-src="audio/album1/track8.mp3" data-title="Ce Soir">
  <img src="img/cover8.jpg"><span>08 - Ce Soir</span>
</div>

<div class="track" data-src="audio/album1/track9.mp3" data-title="Connexion">
  <img src="img/cover9.jpg"><span>09 - Connexion</span>
</div>

<div class="track" data-src="audio/album1/track10.mp3" data-title="Soirée folle">
  <img src="img/cover10.jpg"><span>10 - Soirée folle</span>
</div>

<div class="track" data-src="audio/album1/track11.mp3" data-title="Beyond the Dark">
  <img src="img/cover11.jpg"><span>11 - Beyond the Dark</span>
</div>

<div class="track" data-src="audio/album1/track12.mp3" data-title="Magnétique">
  <img src="img/cover12.jpg"><span>12 - Magnétique</span>
</div>

<!-- JS -->
<script>
const player = document.getElementById("player");
const tracks = document.querySelectorAll(".track");

const miniTitle = document.getElementById("miniTitle");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

let currentIndex = 0;
let isPlaying = false;

// PLAY TRACK
function playTrack(index) {
  const track = tracks[index];
  if (!track) return;

  currentIndex = index;

  player.src = track.dataset.src;
  player.play();

  miniTitle.textContent = track.dataset.title;
  isPlaying = true;
  playBtn.textContent = "⏸";
}

// CLICK TRACK
tracks.forEach((t, i) => {
  t.addEventListener("click", () => {
    playTrack(i);
  });
});

// PLAY / PAUSE
playBtn.addEventListener("click", () => {
  if (isPlaying) {
    player.pause();
    playBtn.textContent = "▶";
  } else {
    player.play();
    playBtn.textContent = "⏸";
  }
  isPlaying = !isPlaying;
});

// NEXT / PREV
nextBtn.addEventListener("click", () => {
  currentIndex = (currentIndex + 1) % tracks.length;
  playTrack(currentIndex);
});

prevBtn.addEventListener("click", () => {
  currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
  playTrack(currentIndex);
});

// AUTOPLAY NEXT
player.addEventListener("ended", () => {
  currentIndex = (currentIndex + 1) % tracks.length;
  playTrack(currentIndex);
});

// PROGRESS BAR
player.addEventListener("timeupdate", () => {
  progress.value = (player.currentTime / player.duration) * 100;
});

progress.addEventListener("input", () => {
  player.currentTime = (progress.value / 100) * player.duration;
});

// VOLUME
volume.addEventListener("input", () => {
  player.volume = volume.value;
});
</script>

</body>
</html>
